name: CI

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Écrire le résumé
        if: always()
        run: |
          echo "## Résultat de la CI" >> $GITHUB_STEP_SUMMARY
          echo "- Statut du job : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY