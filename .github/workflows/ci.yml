name: exo1

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
        run: npm ci
        run: npm test

      - name: Écrire le résumé
        if: always()
        run: |
          echo "## Résultat de la CI" >> $GITHUB_STEP_SUMMARY
          echo "- Statut du job : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY